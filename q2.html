<script>
const music = document.getElementById("bgMusic");

// Page unlock hone ke baad automatically music play karne ki koshish karega
function startMusic() {
    music.volume = 0.8;
    music.play().catch(() => {
        // Agar browser autoplay block kare to
        document.addEventListener("click", () => {
            music.play();
        }, { once: true });
    });
}

const lock = document.getElementById("lock");

const observer = new MutationObserver(() => {
    if (lock.classList.contains("open")) {
        startMusic();
        observer.disconnect();
    }
});

observer.observe(lock, {
    attributes: true,
    attributeFilter: ["class"]
});
</script>
