<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }

        /* Main Card */
        .card {
            background: white;
            padding: 40px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            position: relative;
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .emoji {
            font-size: 80px;
            display: block;
            animation: bounce 1s infinite;
            margin-bottom: 10px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            color: #ff6b81;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            color: #636e72;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            outline: none;
        }

        .btn-forgive {
            background: linear-gradient(135deg, #ff6b81 0%, #ff8e94 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.4);
        }

        .btn-forgive:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(255, 107, 129, 0.6);
        }

        .btn-nah {
            background: linear-gradient(135deg, #a4b0be 0%, #ced6e0 100%);
            color: #2f3542;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            position: fixed;
            z-index: 100;
        }

        .btn-nah:hover {
            transform: scale(1.05);
        }

        /* Success Screen */
        .success {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffeaaf 0%, #fab1a0 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .success.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success .emoji {
            font-size: 100px;
            animation: celebrate 0.5s infinite;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1) rotate(-10deg); }
            50% { transform: scale(1.1) rotate(10deg); }
        }

        .success h1 {
            font-size: 36px;
            color: #e17055;
            margin: 20px 0;
        }

        .success p {
            font-size: 20px;
            color: #d63031;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 999;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>
    <!-- Background Hearts -->
    <div class="bg-hearts" id="bgHearts"></div>

    <!-- Main Card -->
    <div class="card" id="mainCard">
        <span class="emoji">🥺🐹</span>
        <h1>I'm really sorry 🥺</h1>
        <p>please forgive me</p>
        
        <div class="buttons">
            <button class="btn btn-forgive" id="forgiveBtn">Maaf Kar Diya ❤️</button>
        </div>
    </div>

    <!-- The Nahi Button (Fixed position to move freely) -->
    <button class="btn btn-nah" id="nahBtn">Nahi Kiya 😒</button>

    <!-- Success Screen -->
    <div class="success" id="successScreen">
        <span class="emoji">😍💖</span>
        <h1>Yay!</h1>
        <p>Thank you for forgiving me ❤️🥰</p>
    </div>

    <script>
        // Create background hearts
        const bgHearts = document.getElementById('bgHearts');
        const heartEmojis = ['❤️', '💕', '💗', '💖', '💘'];
        
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            bgHearts.appendChild(heart);
        }

        // Nahi Kiya Button - Move on hover
        const nahBtn = document.getElementById('nahBtn');
        
        function moveButton() {
            // Get viewport dimensions
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            // Button dimensions
            const btnWidth = 150;
            const btnHeight = 50;
            
            // Calculate random position (ensuring it stays within viewport)
            const randomX = Math.random() * (vw - btnWidth);
            const randomY = Math.random() * (vh - btnHeight - 100) + 50; // Add padding
            
            // Apply position
            nahBtn.style.left = randomX + 'px';
            nahBtn.style.top = randomY + 'px';
        }

        // Initial position for Nahi button
        function initNahBtn() {
            const card = document.getElementById('mainCard');
            const rect = card.getBoundingClientRect();
            
            // Position below the card initially but let's offset it slightly
            // Actually, let's position it initially below the main card
            const cardBottom = rect.bottom;
            const cardCenter = rect.left + (rect.width / 2) - 75;
            
            nahBtn.style.left = cardCenter + 'px';
            nahBtn.style.top = (cardBottom + 20) + 'px';
        }

        // Move on hover
        nahBtn.addEventListener('mouseover', moveButton);
        
        // Also move on click attempt
        nahBtn.addEventListener('click', moveButton);

        // Forgive Button - Show success
        const forgiveBtn = document.getElementById('forgiveBtn');
        const successScreen = document.getElementById('successScreen');

        forgiveBtn.addEventListener('click', () => {
            // Hide Nahi button permanently
            nahBtn.style.display = 'none';
            
            // Show success screen
            successScreen.classList.add('show');
            
            // Create confetti
            createConfetti();
        });

        // Confetti function
        function createConfetti() {
            const colors = ['#ff6b81', '#ffeaaf', '#74b9ff', '#55efc4', '#a29bfe'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    // Remove after animation
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        // Initialize
        window.addEventListener('load', initNahBtn);
        
        // Also re-position on resize to keep it accessible
        window.addEventListener('resize', () => {
            if (!successScreen.classList.contains('show')) {
                moveButton();
            }
        });
    </script>
</body>
</html>
